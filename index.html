<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backspin Tennis Tournament</title>
<style>
:root{--blue:#1D50A3;--blue2:#EAF1FC;--ink:#20242A;--muted:#727982;--bg:#F6F7F9;--card:#fff;--line:#E2E6EB;--green:#177245;--greenbg:#E2F3EA;--amber:#8A5B00;--amberbg:#FFF0C8;--red:#A33B32;--redbg:#FBE3E0;--purple:#6247A7;--purplebg:#EEE9FB;--shadow:0 10px 30px rgba(20,35,60,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.shell{max-width:1180px;margin:auto;padding:0 22px}.header{height:74px;background:var(--blue);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}.header-in{height:100%;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{height:50px;width:50px;object-fit:contain;display:block}.brand{display:flex;align-items:center;gap:12px;font-weight:850}.brand span{font-size:16px;letter-spacing:.04em}.header-actions{display:flex;align-items:center;gap:8px}.icon-btn{position:relative;width:40px;height:40px;border:1px solid #ffffff33;background:#ffffff10;color:#fff;border-radius:11px;display:grid;place-items:center}.unread{position:absolute;right:-4px;top:-4px;background:#E75D4C;color:#fff;font-size:9px;font-weight:900;min-width:18px;height:18px;border-radius:50%;display:grid;place-items:center}.lang{border:0;background:transparent;color:#fff;font-size:11px;font-weight:800;padding:7px 4px;border-bottom:2px solid transparent}.lang.active{border-color:#fff}.bell-menu{display:none;position:absolute;right:0;top:50px;width:340px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.bell-wrap{position:relative}.bell-wrap.open .bell-menu{display:block}.bell-head{padding:14px 16px;font-weight:850;border-bottom:1px solid var(--line)}.notice-row{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px}.notice-row:last-child{border:0}.notice-row small{display:block;color:var(--muted);margin-top:4px}.main{padding:30px 0 90px}.view{display:none}.view.active{display:block}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.11em;color:var(--blue);text-transform:uppercase}.hero{background:var(--blue);color:#fff;border-radius:22px;padding:28px;box-shadow:var(--shadow);margin-bottom:22px}.hero h1{font-size:34px;line-height:1.05;margin:8px 0}.hero p{color:#E6EEFB;max-width:620px;line-height:1.55}.hero .hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.meta-chip{background:#ffffff18;border:1px solid #ffffff33;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:750}.section{margin-top:22px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}.section-title h2{margin:0;font-size:20px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 3px 15px #18253d08}.division{display:flex;align-items:center;justify-content:space-between;gap:14px}.division h3{margin:0 0 5px;font-size:16px}.division .count{font-size:12px;color:var(--muted)}.division .action{min-width:104px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.ghost{background:transparent;color:var(--blue);border:0}.danger{background:var(--redbg);color:var(--red)}.full{width:100%}.status{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:850}.s-confirmed{background:var(--greenbg);color:var(--green)}.s-pending{background:var(--amberbg);color:var(--amber)}.s-waiting{background:var(--purplebg);color:var(--purple)}.s-cancelled{background:var(--redbg);color:var(--red)}.info{padding:12px 14px;border-radius:12px;background:var(--blue2);font-size:12px;color:#31547F}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-top:13px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.input,.select,.textarea{width:100%;border:1px solid #D2D7DE;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}.textarea{min-height:90px;resize:vertical}.radio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;text-align:left}.choice.selected{border:2px solid var(--blue);background:var(--blue2);padding:12px}.choice strong{display:block}.choice small{color:var(--muted)}.steps{display:flex;gap:6px;margin:18px 0}.step{flex:1;height:4px;background:#E1E5EA;border-radius:9px}.step.active{background:var(--blue)}.wizard-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}.event{position:relative;margin-bottom:18px}.event:before{content:"";position:absolute;left:-24px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--blue)}.event b{font-size:12px}.event small{display:block;color:var(--muted);margin-top:3px}.bell-wrap{position:relative}.bottom-nav{display:none}.mobile-only{display:none}.profile-head{display:flex;align-items:center;gap:14px}.avatar{width:56px;height:56px;border-radius:16px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;font-weight:900}.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}.empty{text-align:center;padding:45px 20px;color:var(--muted)}
/* admin */
.admin-body{background:#F5F6F8}.admin-login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.login-card .logo{margin:0 auto 18px}.admin-shell{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 74px)}.admin-side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:74px;height:calc(100vh - 74px)}.admin-side .group{font-size:9px;color:#9AA0A8;font-weight:850;letter-spacing:.1em;padding:14px 10px 6px}.admin-side button{width:100%;text-align:left;border:0;background:transparent;color:#68707A;border-radius:10px;padding:11px 10px;font-weight:750;font-size:12px}.admin-side button.active{background:var(--blue2);color:var(--blue)}.admin-main{padding:28px 30px 70px}.admin-view{display:none}.admin-view.active{display:block}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.kpi .num{font-size:26px;font-weight:900;margin-top:4px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-size:10px;background:#FAFAFB}.table tr.clickable{cursor:pointer}.filters{display:grid;grid-template-columns:1.8fr repeat(4,1fr);gap:8px}.admin-detail{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:50;place-items:center;padding:20px}.modal.open{display:grid}.modal-card{width:min(500px,100%);background:#fff;border-radius:16px;padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;background:#20242A;color:#fff;padding:11px 14px;border-radius:10px;font-size:12px;display:none;z-index:100}.toast.show{display:block}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}.admin-shell{grid-template-columns:1fr}.admin-side{position:static;height:auto;display:flex;overflow:auto;gap:4px;border-right:0;border-bottom:1px solid var(--line)}.admin-side .group{display:none}.admin-side button{min-width:max-content}.admin-main{padding:20px}.admin-detail{grid-template-columns:1fr}}
@media(max-width:700px){.shell{padding:0 15px}.header{height:66px}.logo{height:44px;width:44px}.brand span{font-size:13px}.main{padding:18px 0 90px}.hero{padding:22px;border-radius:18px}.hero h1{font-size:29px}.grid,.form-grid,.radio-grid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.bottom-nav{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);bottom:0;left:0;right:0;height:66px;background:#fff;border-top:1px solid var(--line);z-index:30}.bottom-nav button{border:0;background:#fff;color:#77808A;font-size:10px;font-weight:800}.bottom-nav button span{display:block;font-size:21px;margin-bottom:1px}.bottom-nav button.active{color:var(--blue)}.bell-menu{position:fixed;right:10px;top:60px;width:min(340px,calc(100vw - 20px))}.mobile-only{display:block}.admin-main{padding:16px 12px}.kpis{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
</style>

async function initBackspin(){
  try{
    currentSession=await window.backspinData.ensureDevSession();
    currentPlayer=await window.backspinData.ensurePlayer(currentSession);
    const loaded=await window.backspinData.loadTournament();
    currentTournament=loaded.tournament;
    divisions=loaded.divisions.map(d=>[d.name,String(d.level),0,d.capacity,Number(d.fee),d.division_id,d.format]);
    const regs=await window.backspinData.loadRegistrations(currentPlayer.player_id);
    state.registrations=regs.map(r=>({
      id:r.registration_id,
      category:r.divisions?.name||'',
      level:String(r.divisions?.level||''),
      status:r.registration_status,
      payment:r.payment_status,
      created:new Date(r.submitted_at).toLocaleString('en-GB'),
      divisionId:r.division_id
    }));
    dbReady=true;
    render();
  }catch(e){
    console.warn('Backspin DB init unavailable; demo mode retained.',e);

}
function t(k){return I18N[lang][k]||k}function $(id){return document.getElementById(id)}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function setLang(x){lang=x;localStorage.setItem('backspin_lang',x);render()}
function shell(active){return `<header class="header"><div class="shell header-in"><div class="brand"><img class="logo" src="${LOGO}" alt="Backspin"><span>BACKSPIN TENNIS CLUB</span></div><div class="header-actions"><div class="bell-wrap" id="bell"><button class="icon-btn" onclick="toggleBell()" aria-label="Notifications">♧<span class="unread">${state.notifications.filter(n=>n.unread).length}</span></button><div class="bell-menu"><div class="bell-head">${t('notifications')}</div>${state.notifications.slice(0,10).map(n=>`<div class="notice-row"><b>${esc(n.title)}</b><small>${esc(n.detail)}</small></div>`).join('')}</div></div><button class="lang ${lang==='th'?'active':''}" onclick="setLang('th')">TH</button><span style="opacity:.5">/</span><button class="lang ${lang==='en'?'active':''}" onclick="setLang('en')">EN</button></div></div></header>`}
function toggleBell(){const b=$('bell');b.classList.toggle('open');if(b.classList.contains('open'))state.notifications.forEach(n=>n.unread=false)}
function playerNav(active){return `<nav class="bottom-nav"><button class="${active==='register'?'active':''}" onclick="go('register')"><span>＋</span>${t('register')}</button><button class="${active==='mine'?'active':''}" onclick="go('mine')"><span>▣</span>${t('mine')}</button><button class="${active==='profile'?'active':''}" onclick="go('profile')"><span>○</span>${t('profile')}</button></nav>`}
function render(){document.documentElement.lang=lang;const path=location.pathname; if(path==='/admin'||path.startsWith('/admin/')){renderAdmin();return}renderPlayer()}
function go(page){state.page=page;state.step=1;history.pushState({},'',page==='register'?'/':`/${page}`);render()}
window.onpopstate=()=>render();
function renderPlayer(){
 let body='';
 if(state.page==='register')body=registerPage();else if(state.page==='mine')body=minePage();else body=profilePage();
 $('root').innerHTML=shell(state.page)+`<main class="shell main">${body}</main>`+playerNav(state.page);if(state.page==='register')renderWizard();
}
function registerPage(){return `<section class="view active"><div class="hero"><div class="eyebrow" style="color:#DCE9FA">BACKSPIN TENNIS TOURNAMENT</div><h1>${t('tournament')}</h1><p>${t('date')} · ${t('venue')}</p><div class="hero-meta"><span class="meta-chip">Registration Open</span><span class="meta-chip">Thai / English</span><span class="meta-chip">Asia/Bangkok</span></div></div><div class="section"><div class="section-title"><div><h2>${t('choose')}</h2><div class="muted">Fee and capacity are configured per Category + Level.</div></div></div><div class="grid">${divisions.map((d,i)=>divisionCard(d,i)).join('')}</div></div></section>`}
function divisionCard(d,i){const full=d[2]>=d[3];const eligible=!(d[0]==='Men Singles'&&d[1]==='3.5');return `<div class="card"><div class="division"><div><h3>${d[0]} · ${d[1]}</h3><div class="count">${d[2]} / ${d[3]} · ฿${d[4].toLocaleString()}</div><div style="margin-top:8px">${eligible?'<span class="status s-confirmed">'+t('eligible')+'</span>':'<span class="status s-cancelled">'+t('notEligible')+'</span>'}</div></div><div class="action">${full?`<button class="btn secondary full" onclick="startRegister(${i},true)">${t('waiting')}</button>`:`<button class="btn primary full" ${eligible?'':'disabled'} onclick="startRegister(${i},false)">${t('register')}</button>`}</div></div></div>`}
function startRegister(i,waiting){const d=divisions[i];state.category=d[0];state.level=d[1];state.waiting=waiting;state.step=1;state.slip=null;state.partner={name:'',phone:'',email:''};renderWizardPage();}
function renderWizardPage(){document.querySelector('.main').innerHTML=wizardPage();renderWizard()}
function wizardPage(){const isDouble=state.category&&state.category.includes('Doubles')||state.category==='Mixed Doubles';return `<section class="view active"><button class="ghost" onclick="go('register')">← ${t('back')}</button><div style="margin-top:10px"><div class="eyebrow">REGISTRATION</div><h1>${esc(state.category)} · ${esc(state.level)}</h1><div class="steps"><i class="step ${state.step>=1?'active':''}"></i><i class="step ${state.step>=2?'active':''}"></i><i class="step ${state.step>=3?'active':''}"></i><i class="step ${state.step>=4?'active':''}"></i></div>${wizardStep(isDouble)}</div></section>`}
function wizardStep(isDouble){

 if(state.step===2)return `<div class="card"><h2>Player details</h2><div class="form-grid"><div class="field"><label>Name</label><input class="input" value="Paphawee Lumlert"></div><div class="field"><label>Phone</label><input class="input" value="08X-XXX-XXXX"></div></div><div class="field"><label>Email *</label><input class="input" value="player@example.com"></div>${isDouble?`<div class="section"><h3>Partner</h3><div class="muted">Name + phone required. Email optional.</div><div class="form-grid"><div class="field"><label>Partner Name *</label><input id="pname" class="input" value="${esc(state.partner.name)}"></div><div class="field"><label>Partner Phone *</label><input id="pphone" class="input" value="${esc(state.partner.phone)}"></div></div><div class="field"><label>Partner Email</label><input id="pemail" class="input" value="${esc(state.partner.email)}"></div></div>`:''}<div class="wizard-actions"><button class="btn secondary" onclick="prevStep()">${t('back')}</button><button class="btn primary" onclick="nextStep()">${t('next')}</button></div></div>`;
 if(state.step===3)return `<div class="card"><h2>${t('payment')}</h2><div class="info">Payment is required separately for each registration. Doubles fee is paid once by the main registrant.</div><div class="section"><label class="btn secondary full" style="text-align:center">${t('upload')} <input id="slip" type="file" accept="image/*" hidden onchange="state.slip=this.files[0]?.name||null;renderWizard()"></label><div class="muted" style="margin-top:8px">${state.slip?esc(state.slip):'ยังไม่ได้เลือกไฟล์'}</div></div><div class="wizard-actions"><button class="btn secondary" onclick="prevStep()">${t('back')}</button><button class="btn primary" onclick="nextStep()">${t('next')}</button></div></div>`;
 return `<div class="card"><h2>${state.waiting?t('waiting'):'Review & submit'}</h2><div class="line"><span>Category</span><b>${esc(state.category)}</b></div><div class="line"><span>Level</span><b>${esc(state.level)}</b></div><div class="line"><span>Payment slip</span><b>${state.slip?'Uploaded':'Missing'}</b></div>${state.waiting?'<div class="info section">This division is full. Your registration will enter FCFS Waiting List. If a seat is released, the first eligible player receives a 24h offer.</div>':''}<div class="wizard-actions"><button class="btn secondary" onclick="prevStep()">${t('back')}</button><button class="btn primary" onclick="submitRegistration()">${t('submit')}</button></div></div>`;

  }
  const id='REG-2027-'+String(Math.floor(100000+Math.random()*899999));
  state.registrations.unshift({id,category:state.category,level:state.level,status:state.waiting?'WAITING_LIST':'PAYMENT_REQUIRED',payment:state.waiting?'NOT_REQUIRED':'PENDING',created:new Date().toLocaleString('en-GB')});
  toast('Registration submitted');go('mine');
}
function minePage(){return `<section class="view active"><div class="eyebrow">MY REGISTRATIONS</div><h1>${t('mine')}</h1><div class="grid">${state.registrations.map(r=>regCard(r)).join('')}</div></section>`}
function regCard(r){let cls=r.status==='Confirmed'?'s-confirmed':r.status==='Waiting List'?'s-waiting':r.status==='Cancelled'?'s-cancelled':'s-pending';return `<div class="card"><div class="division"><div><div class="muted">${esc(r.id)}</div><h3 style="margin:6px 0">${esc(r.category)} · ${esc(r.level)}</h3></div><span class="status ${cls}">${esc(r.status)}</span></div><div class="line"><span>Payment</span><b>${esc(r.payment)}</b></div><div class="line"><span>Registered</span><b>${esc(r.created)}</b></div><div class="section"><div class="timeline"><div class="event"><b>Registration Submitted</b><small>${esc(r.created)}</small></div>${r.status==='Confirmed'?'<div class="event"><b>Confirmed</b><small>Approval timestamp</small></div>':r.status==='Waiting List'?'<div class="event"><b>Waiting List</b><small>FCFS queue · offer rules apply</small></div>':'<div class="event"><b>Pending Payment Verification</b><small>Admin will review your latest slip</small></div>'}</div></div>${r.status==='Pending Payment Verification'?'<button class="btn danger full" onclick="toast(\'Player can self-cancel only while Pending Payment Verification\')">Cancel registration</button>':''}</div>`}
function profilePage(){return `<section class="view active"><div class="eyebrow">PROFILE</div><h1>${t('profileTitle')}</h1><div class="card"><div class="profile-head"><div class="avatar">PL</div><div><h2 style="margin:0">Paphawee Lumlert</h2><div class="muted">Verified · LINE linked</div></div></div><div class="section"><div class="line"><span>Name</span><b>Paphawee Lumlert</b></div><div class="line"><span>Phone</span><b>08X-XXX-XXXX</b></div><div class="line"><span>Email</span><b>player@example.com</b></div><div class="line"><span>LINE</span><b>Connected</b></div></div></div><div class="section"><div class="section-title"><h2>Champion History</h2></div>${state.champions.map(c=>`<div class="card" style="margin-bottom:10px"><b>${esc(c.name)}</b><div class="muted">${esc(c.t)} · ${esc(c.c)} · ${esc(c.l)}</div></div>`).join('')}</div><div class="section"><div class="card"><h3>Current Eligibility</h3><div class="line"><span>Men Singles · 3.5</span><span class="status s-cancelled">Restricted</span></div><div class="muted">Reason: Previous Champion · Higher levels remain allowed.</div></div></div></section>`}
function adminHeader(){return `<header class="header"><div class="shell header-in"><div class="brand"><img class="logo" src="${LOGO}" alt="Backspin"><span>BACKSPIN ADMIN</span></div><div class="header-actions"><span class="muted" style="color:#fff">Admin: Jane</span><button class="btn secondary" onclick="location.href='/'">Player</button></div></div></header>`}
function renderAdmin(){if(!state.adminLogged){$('root').innerHTML=adminLoginPage();return}$('root').innerHTML=adminHeader()+`<div class="admin-shell"><aside class="admin-side">${adminNav()}</aside><main class="admin-main">${adminContent()}</main></div>`}
function adminLoginPage(){return `<div class="admin-login"><div class="login-card"><img class="logo" src="${LOGO}" alt="Backspin"><div class="eyebrow" style="text-align:center">ADMIN PORTAL</div><h1 style="text-align:center">Backspin Admin</h1><p class="muted" style="text-align:center">Admin access is separate at /admin.</p><div class="field"><label>Email</label><input id="aemail" class="input" value="admin@backspin.club"></div><div class="field"><label>Password</label><input id="apass" type="password" class="input" value="demo"></div><button class="btn primary full section" onclick="adminLogin()">เข้าสู่ Admin Portal</button></div></div>`}
function adminLogin(){state.adminLogged=true;state.adminPage='dashboard';renderAdmin()}
function adminNav(){return `<div class="group">OVERVIEW</div><button class="${state.adminPage==='dashboard'?'active':''}" onclick="adminGo('dashboard')">Dashboard</button><button class="${state.adminPage==='tournaments'?'active':''}" onclick="adminGo('tournaments')">Tournaments</button><div class="group">OPERATIONS</div><button class="${state.adminPage==='registrations'?'active':''}" onclick="adminGo('registrations')">Registrations</button><button class="${state.adminPage==='players'?'active':''}" onclick="adminGo('players')">Players</button><button class="${state.adminPage==='champion'?'active':''}" onclick="adminGo('champion')">Champion History</button><div class="group">SYSTEM</div><button class="${state.adminPage==='audit'?'active':''}" onclick="adminGo('audit')">Audit Log</button>`}
function adminGo(p){state.adminPage=p;renderAdmin()}
function adminContent(){if(state.adminPage==='dashboard')return adminDashboard();if(state.adminPage==='tournaments')return adminTournaments();if(state.adminPage==='registrations')return adminRegistrations();if(state.adminPage==='detail')return adminDetail();if(state.adminPage==='champion')return adminChampion();if(state.adminPage==='players')return adminPlayers();return adminAudit()}
function adminDashboard(){return `<div class="eyebrow">ADMIN DASHBOARD</div><div class="section-title"><div><h1 style="margin:4px 0">Backspin January Open</h1><div class="muted">26–27 Jan 2027 · Backspin Tennis Club · OPEN</div></div><button class="btn primary" onclick="adminGo('registrations')">Review registrations</button></div><div class="kpis"><div class="kpi"><div class="muted">Total</div><div class="num">42</div></div><div class="kpi"><div class="muted">Confirmed</div><div class="num">28</div></div><div class="kpi"><div class="muted">Pending</div><div class="num">8</div></div><div class="kpi"><div class="muted">Waiting</div><div class="num">6</div></div><div class="kpi"><div class="muted">Cancelled</div><div class="num">0</div></div></div><div class="section grid3"><div class="card"><h3>Men Singles · 3.5</h3><div class="muted">28 / 32</div><span class="status s-confirmed" style="margin-top:9px">OPEN</span></div><div class="card"><h3>Men Doubles · 3.5</h3><div class="muted">32 / 32</div><span class="status s-cancelled" style="margin-top:9px">FULL</span></div><div class="card"><h3>Women Singles · 3.5</h3><div class="muted">0 / 32</div><span class="status s-confirmed" style="margin-top:9px">OPEN</span></div></div><div class="section card"><div class="section-title"><h2>Recent Activity</h2><span class="muted">10 latest · Bangkok time</span></div><div class="line"><span>Payment Resubmitted</span><b>REG-2027-000123</b></div><div class="line"><span>Waiting List Offer Sent</span><b>REG-2027-000130</b></div><div class="line"><span>Partner Changed</span><b>REG-2027-000124</b></div></div>`}
function adminTournaments(){return `<div class="section-title"><div><div class="eyebrow">TOURNAMENTS</div><h1>Tournament List</h1></div><button class="btn primary" onclick="toast('Tournament setup opened')">Create Tournament</button></div><div class="grid"><div class="card"><div class="division"><div><h3>Backspin January Open</h3><div class="muted">26–27 Jan 2027 · Backspin Tennis Club</div></div><span class="status s-confirmed">OPEN</span></div><div class="section"><button class="btn secondary" onclick="toast('Edit Tournament')">Edit</button></div></div><div class="card"><div class="division"><div><h3>Backspin February Open</h3><div class="muted">Date TBD</div></div><span class="status s-pending">DRAFT</span></div></div></div>`}
function adminRegistrations(){const rows=state.registrations.concat([{id:'REG-2027-000130',category:'Men Doubles',level:'3.5',status:'Waiting List',payment:'—',created:'22/11/2026 07:30 PM'}]);return `<div class="section-title"><div><div class="eyebrow">REGISTRATION TABLE</div><h1>Registrations</h1><div class="muted">25 rows/page · filters/search/sort persist</div></div><button class="btn secondary" onclick="toast('Export Filtered / Export All')">Export Excel</button></div><div class="card"><div class="filters"><input class="input" placeholder="Registration ID / Name / Phone / Email"><select class="select"><option>Tournament: All</option></select><select class="select"><option>Category: All</option></select><select class="select"><option>Level: All</option></select><select class="select"><option>Status: All</option></select></div><div class="table-wrap section"><table class="table"><thead><tr><th>Registration</th><th>Player / Team</th><th>Category</th><th>Level</th><th>Registration Status</th><th>Payment Status</th><th>Date/Time</th></tr></thead><tbody>${rows.map(r=>`<tr class="clickable" onclick="openAdminDetail('${r.id}')"><td>${esc(r.id)}</td><td>Demo Player / Team</td><td>${esc(r.category)}</td><td>${esc(r.level)}</td><td>${adminStatus(r.status)}</td><td>${esc(r.payment)}</td><td>${esc(r.created)}</td></tr>`).join('')}</tbody></table></div></div>`}
function adminStatus(s){const c=s==='Confirmed'?'s-confirmed':s==='Waiting List'?'s-waiting':s==='Cancelled'?'s-cancelled':'s-pending';return `<span class="status ${c}">${esc(s)}</span>`}
function openAdminDetail(id){state.adminDetail=id;state.adminPage='detail';renderAdmin()}
function adminDetail(){const r=state.registrations.find(x=>x.id===state.adminDetail)||state.registrations[0];return `<button class="btn secondary" onclick="adminGo('registrations')">← Registrations</button><div class="admin-detail section"><div class="card"><div class="eyebrow">REGISTRATION DETAIL</div><h1>${esc(r.id)}</h1>${adminStatus(r.status)}<div class="line"><span>Player / Team</span><b>Demo Player / Team</b></div><div class="line"><span>Category / Level</span><b>${esc(r.category)} · ${esc(r.level)}</b></div><div class="line"><span>Phone</span><b>08X-XXX-XXXX</b></div><div class="line"><span>Email</span><b>player@example.com</b></div><div class="section"><h3>Latest Payment Slip</h3><div style="height:180px;border-radius:12px;background:#F0F2F5;display:grid;place-items:center;color:#9098A2">Payment Slip Preview</div></div><div class="section" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="approve('${r.id}')">Approve Payment</button><button class="btn danger" onclick="reject('${r.id}')">Reject Payment</button></div></div><div><div class="card"><h2>Status Timeline</h2><div class="timeline"><div class="event"><b>Payment Under Verification</b><small>Player: Demo · ${esc(r.created)}</small></div><div class="event"><b>Registration Submitted</b><small>Player: Demo · ${esc(r.created)}</small></div></div></div><div class="card section"><h2>Audit Log</h2><div class="muted">Before / After / Action / Date-Time / Admin</div><div class="section info">Registration status changes are audited. Payment slip history remains attached to the same Registration ID.</div></div></div></div>`}
function approve(id){const r=state.registrations.find(x=>x.id===id);if(r){r.status='Confirmed';r.payment='Approved'}toast('Payment approved → Confirmed');renderAdmin()}
function reject(id){openModal(`<h2>Reject Payment</h2><div class="muted">${esc(id)} · Reject reason is mandatory.</div><div class="field"><label>Reason</label><select id="rejectReason" class="select"><option>ยอดเงินไม่ถูกต้อง</option><option>สลิปไม่ชัดเจน</option><option>สลิปไม่ตรงรายการ</option><option>สลิปหมดอายุ</option><option>อื่นๆ</option></select></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="confirmReject('${id}')">Reject</button></div>`)}
function confirmReject(id){const r=state.registrations.find(x=>x.id===id);if(r){r.status='Pending Payment Verification';r.payment='Rejected — correction 48h'}closeModal();toast('Payment rejected · 48h correction started');renderAdmin()}
function adminChampion(){return `<div class="eyebrow">CHAMPION MANAGEMENT</div><h1>Champion History</h1><div class="card"><div class="field"><label>Category + Level</label><select class="select"><option>Men Singles · 3.5</option><option>Men Doubles · 3.5</option></select></div><div class="field"><label>Champion / Result Status</label><select class="select"><option>Demo Player — Confirmed Registration</option><option>No Winner</option><option>Cancelled</option><option>Walkover</option><option>Disqualified</option><option>Forfeit</option><option>Not Held</option></select></div><div class="info section">Saving Champion updates current Eligibility immediately. Historical records remain.</div><button class="btn primary section" onclick="toast('Champion saved · Eligibility updated')">Save Champion</button><h2 class="section">History</h2>${state.champions.map(c=>`<div class="line"><span>${esc(c.t)} · ${esc(c.c)} · ${esc(c.l)}</span><b>${esc(c.name)}</b></div>`).join('')}</div>`}
function adminPlayers(){return `<div class="eyebrow">PLAYER PROFILE</div><h1>Players</h1><div class="card"><input class="input" placeholder="Search Name / Phone / Email / LINE User ID"><div class="line section"><span><b>Demo Player</b><small class="muted" style="display:block">08X-XXX-XXXX · Verified</small></span><button class="btn secondary" onclick="toast('Profile is view-only for Admin')">View</button></div><div class="line"><span><b>Partner Demo</b><small class="muted" style="display:block">09X-XXX-XXXX · Unverified</small></span><button class="btn secondary" onclick="toast('Profile is view-only for Admin')">View</button></div></div>`}
function adminAudit(){return `<div class="eyebrow">SYSTEM</div><h1>Audit Log</h1><div class="card"><div class="filters"><select class="select"><option>Action: All</option></select><select class="select"><option>Admin: All</option></select><input class="input" placeholder="Registration ID"><input class="input" placeholder="Date/time range"><button class="btn primary" onclick="toast('Search')">Search</button></div><div class="section"><div class="line"><span><b>Payment Reject</b><small class="muted" style="display:block">REG-2027-000123 · Admin: Jane</small></span><span>22/11/2026 09:15 PM</span></div><div class="line"><span><b>Partner Changed</b><small class="muted" style="display:block">REG-2027-000124 · Admin: Jane</small></span><span>22/11/2026 09:10 PM</span></div></div><div class="muted section">Newest → oldest · 25 rows/page · not exportable in V1</div></div>`}
function openModal(html){$('modal').innerHTML=`<div class="modal-card">${html}</div>`;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
render();
initBackspin();
</script>
</body></html>
