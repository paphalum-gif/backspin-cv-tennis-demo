<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backspin · Signing in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:#14213d}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(460px,100%);background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:40px 32px;text-align:center;box-shadow:0 12px 40px rgba(20,33,61,.08)}
.logo{width:64px;height:64px;border-radius:16px;background:#174ea6;display:grid;place-items:center;margin:0 auto 16px;color:#fff;font-size:30px;font-weight:800}
h1{margin:0 0 10px;font-size:26px}.muted{color:#68758a;line-height:1.5}.error{display:none;margin-top:20px;padding:14px;border-radius:10px;background:#fff0f0;color:#b42318;text-align:left;font-size:14px}.btn{display:none;margin-top:18px;width:100%;padding:12px 16px;border:0;border-radius:10px;background:#174ea6;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="logo">B</div>
<h1 id="title">Signing you in</h1>
<p id="status" class="muted">Completing your LINE sign-in securely…</p>
<div id="error" class="error"></div>
<button id="retry" class="btn" onclick="location.replace('/')">Return to Backspin</button>
</div></div>
<script>
(async function(){
  const SUPABASE_URL='https://ddnmrbkkrllmxsflkmam.supabase.co';
  const SUPABASE_KEY='sb_publishable_w0ECVY33KmSCev_0XHfA-A_vAxWHsjm';
  const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,flowType:'pkce',experimental:{appendPkceFlowIdToRedirects:true}}});
  const p=new URLSearchParams(location.search);
  const code=p.get('code');
  const flowId=p.get('sb_flow_id');
  const existing=await supabase.auth.getSession();
  if(existing.data?.session){location.replace('/');return}
  if(p.get('error')){
    document.getElementById('title').textContent='Sign-in could not be completed';
    document.getElementById('status').textContent='We received an incomplete LINE callback. Please try again.';
    const e=document.getElementById('error');e.style.display='block';e.textContent=(p.get('error_description')||p.get('error')).replace(/\+/g,' ');
    document.getElementById('retry').style.display='block';
    return;
  }
  if(!code){
    location.replace('/');
    return;
  }
  try{
    const {data,error}=await supabase.auth.exchangeCodeForSession(code,flowId?{flowId}:undefined);
    if(error)throw error;
    if(!data?.session)throw new Error('No Backspin session was created.');
    history.replaceState({},document.title,'/auth/callback');
    location.replace('/');
  }catch(err){
    const again=await supabase.auth.getSession();
    if(again.data?.session){location.replace('/');return}
    console.error('Backspin OAuth callback error',err);
    document.getElementById('title').textContent='Sign-in could not be completed';
    document.getElementById('status').textContent='Please start LINE Login again.';
    const e=document.getElementById('error');e.style.display='block';e.textContent=err?.message||'Unable to complete sign-in.';
    document.getElementById('retry').style.display='block';
  }
})();
</script>
</body></html>
